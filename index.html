<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>앵커 한마당 부스 현황판</title>
<!-- ★★★ 여기 한 줄만 고치면 됩니다 ★★★
     Apps Script [배포 > 배포 관리]의 웹 앱 URL (https://script.google.com/macros/s/…/exec) 을 따옴표 안에 붙여넣으세요.
     이 파일을 GitHub Pages 등 외부에 올리면(방법 B) 화면은 그곳에서 뜨고, 데이터만 이 주소의 Apps Script 에 요청합니다.
     방문객이 script.google.com 주소를 직접 열지 않으므로 Google 계정이 여러 개인 휴대폰에서도 /u/4/ 문제 없이 열립니다. -->
<script>window.BOOTH_API_URL = 'https://script.google.com/macros/s/AKfycbwX8wthL9K3_SsiKKEoYVPvSaYOzAGD8z74FI9qNVed0OOarUsv1k1vaXKdisA2-xPF/exec';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 행사장 시간표 보드 — 고정 헤더 + 필터 칩 + '부스 간판' 카드 격자. 운영자는 부스×시간대 매트릭스, TV는 2열 전광판. */
:root{
  --bg:#F3F7F5; --surface:#FFFFFF; --surface-2:#E8EEEB; --fg:#15231F; --fg-muted:#5C6C66; --line:#D3DDD8;
  --accent:#0E7C6B; --accent-ink:#FFFFFF; --accent-soft:#D7EFE9;
  --mark:#F2B134; --mark-ink:#3A2A05;
  --ok:#1E8A5B; --ok-soft:#DBF2E5; --warn:#B86A05; --warn-soft:#FBE9CF; --full:#BE3F3A; --full-soft:#F8DEDC;
  --neutral:#66756F; --neutral-soft:#E4EAE7;
  --font-display:'Do Hyeon','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  --radius:12px;
  --shadow:0 1px 2px rgba(21,35,31,.06),0 8px 20px -14px rgba(21,35,31,.3);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1716; --surface:#172120; --surface-2:#1F2B28; --fg:#E6EFEC; --fg-muted:#9AAAA4; --line:#2B3936;
    --accent:#3FB5A0; --accent-ink:#0B1513; --accent-soft:#163B35;
    --mark:#F5C04A; --mark-ink:#2A1E03;
    --ok:#4CC58A; --ok-soft:#173A2B; --warn:#F0A24A; --warn-soft:#3E2A10; --full:#F0776F; --full-soft:#44201E;
    --neutral:#93A39E; --neutral-soft:#263330;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1716; --surface:#172120; --surface-2:#1F2B28; --fg:#E6EFEC; --fg-muted:#9AAAA4; --line:#2B3936;
  --accent:#3FB5A0; --accent-ink:#0B1513; --accent-soft:#163B35;
  --mark:#F5C04A; --mark-ink:#2A1E03;
  --ok:#4CC58A; --ok-soft:#173A2B; --warn:#F0A24A; --warn-soft:#3E2A10; --full:#F0776F; --full-soft:#44201E;
  --neutral:#93A39E; --neutral-soft:#263330;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;word-break:keep-all;overflow-wrap:break-word}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
h1,h2,h3{margin:0;text-wrap:balance}
.app{min-height:calc(100% - var(--chrome,0px))}
.page{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hidden{display:none !important}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ── 상단 헤더 ── */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:34px;height:34px;flex:none;color:var(--accent)}
.brand img.logo{height:40px;width:auto;flex:none;display:block}
.gate .brand img.logo{height:52px}
.qr-card .qr-logo{height:34px;width:auto;display:block;margin:-4px auto 0}
.qr-card.sample{position:relative;overflow:hidden}
.qr-card .sample-mark{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) rotate(-24deg);font:700 26px var(--font-display);color:rgba(190,63,58,.28);border:3px solid rgba(190,63,58,.28);border-radius:10px;padding:6px 16px;white-space:nowrap;pointer-events:none}
.brand-name{font-family:var(--font-display);font-size:22px;line-height:1.15;letter-spacing:.01em}
.brand-sub{font-size:12.5px;color:var(--fg-muted);margin-top:2px}
.live{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fg-muted);white-space:nowrap}
.live .clock{font-family:var(--font-display);font-size:24px;color:var(--fg);letter-spacing:.02em}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:pulse 2s infinite}
.live .dot.off{background:var(--full);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,138,91,.45)}70%{box-shadow:0 0 0 8px rgba(30,138,91,0)}100%{box-shadow:0 0 0 0 rgba(30,138,91,0)}}
.live b{color:var(--fg);font-weight:600}

/* ── 요약 띠 ── */
.summary{display:flex;flex-wrap:wrap;gap:8px 22px;padding-block:12px;font-size:13.5px;color:var(--fg-muted)}
.summary b{color:var(--fg);font-weight:600}
.summary .now{display:inline-flex;align-items:center;gap:6px;background:var(--mark);color:var(--mark-ink);padding:2px 10px;border-radius:999px;font-weight:600}

/* ── 필터 ── */
.filters{display:flex;flex-direction:column;gap:8px;padding-block:4px 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;line-height:1.2;color:var(--fg-muted)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip-label{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);align-self:center;margin-right:2px}
.search{width:100%;max-width:420px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px}
.search::placeholder{color:var(--fg-muted)}

/* ── 부스 카드 격자 ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.booth{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;text-align:left;min-width:0;box-shadow:var(--shadow);transition:transform .12s ease}
.booth:hover{transform:translateY(-1px)}
.booth-head{display:flex;gap:12px;align-items:flex-start;min-width:0}
.no{font-family:var(--font-display);font-size:26px;line-height:1;width:50px;height:50px;flex:none;display:grid;place-items:center;border-radius:10px;background:var(--accent);color:var(--accent-ink)}
.no.always{background:var(--neutral-soft);color:var(--fg)}
.booth-title{min-width:0;flex:1}
.booth-title h3{font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.meta{margin:3px 0 0;font-size:12.5px;color:var(--fg-muted);display:flex;flex-wrap:wrap;gap:4px 8px}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--surface-2);font-size:11.5px;color:var(--fg-muted)}
.tag.cls{background:var(--accent-soft);color:var(--accent)}
.tag.alw{background:var(--neutral-soft);color:var(--neutral)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:6px}
.slot{border-radius:8px;padding:6px 4px;text-align:center;line-height:1.15;border:2px solid transparent}
.slot .t{display:block;font-size:11px;color:var(--fg-muted)}
.slot .n{display:block;font-weight:700;font-size:15px;margin-top:2px}
.slot.ok{background:var(--ok-soft);color:var(--ok)} .slot.ok .t{color:var(--ok)}
.slot.warn{background:var(--warn-soft);color:var(--warn)} .slot.warn .t{color:var(--warn)}
.slot.full{background:var(--full-soft);color:var(--full)} .slot.full .t{color:var(--full)}
.slot.past{background:var(--surface-2);color:var(--fg-muted)}
.slot.now{border-color:var(--mark)}
.always-line{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg-muted);background:var(--surface-2);border-radius:8px;padding:9px 10px}
.always-line b{color:var(--fg)}
.booth-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto}
.avail{font-size:13px;color:var(--fg-muted)}
.avail b{color:var(--fg);font-weight:600}
.avail.full b{color:var(--full)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none;color:var(--fg);line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.big{padding:14px 18px;font-size:17px;width:100%}
.btn[aria-disabled="true"]{opacity:.55;pointer-events:none}
.empty{padding:40px 12px;text-align:center;color:var(--fg-muted);grid-column:1/-1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg-muted);padding-block:10px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.foot{padding-block:28px 0;font-size:12.5px;color:var(--fg-muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}

/* ── 부스 상세 ── */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--fg-muted);background:none;border:0;padding:12px 0 4px;font-size:14px}
.sign{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;box-shadow:var(--shadow);display:grid;gap:18px;margin-top:8px}
.sign-head{display:flex;gap:16px;align-items:flex-start}
.sign .no{width:72px;height:72px;font-size:40px;border-radius:14px}
.sign h2{font-size:22px;font-weight:700;line-height:1.3}
.sign .meta{font-size:14px;margin-top:6px}
.slot-rows{display:grid;gap:8px}
.slot-row{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface-2);border:2px solid transparent}
.slot-row.now{border-color:var(--mark)}
.slot-row .time{font-weight:600}
.slot-row .time small{display:block;font-weight:400;font-size:11.5px;color:var(--fg-muted)}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:999px}
.bar.warn i{background:var(--warn)} .bar.full i{background:var(--full)} .bar.past i{background:var(--neutral)}
.slot-row .left{font-weight:700;white-space:nowrap;text-align:right}
.slot-row .left small{display:block;font-weight:400;font-size:11.5px;color:var(--fg-muted)}
.slot-row.full .left{color:var(--full)} .slot-row.past .left{color:var(--fg-muted)}
.note{font-size:13px;color:var(--fg-muted);line-height:1.55}
.cta{display:grid;gap:8px}
@media (max-width:480px){.slot-row{grid-template-columns:92px minmax(0,1fr) auto;gap:8px;padding:8px 10px}.sign{padding:18px 14px}}

/* ── 운영자 ── */
.gate{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px;box-shadow:var(--shadow);display:grid;gap:12px}
.gate h2{font-family:var(--font-display);font-size:26px;font-weight:400}
.gate input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:20px;letter-spacing:.3em;text-align:center;background:var(--bg)}
.err{color:var(--full);font-size:13px;min-height:1.2em}
.admin-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.admin-top .brand-name{font-size:20px}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;padding-block:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--fg-muted)}
.stat .v{font-family:var(--font-display);font-size:30px;line-height:1.1;margin-top:2px}
.stat .v small{font-family:var(--font-body);font-size:13px;color:var(--fg-muted);margin-left:4px}
.stat .v.small{font-size:22px;margin-top:8px}
.days{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.days .day{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.days .day small{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 6px}
.days .day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.days .day.on small{background:rgba(255,255,255,.25);color:#fff}
.admin-top .days{margin:0}.tv .days{margin-top:6px}.tv .days .day{font-size:16px}
[data-view="qr"] .days{display:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--fg-muted);margin-bottom:-1px}
.tab.on{color:var(--fg);border-color:var(--accent)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--fg-muted);font-weight:600;background:var(--surface-2);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
.matrix th:first-child,.matrix td:first-child{position:sticky;left:0;background:var(--surface);z-index:2;max-width:260px;overflow:hidden;text-overflow:ellipsis}
.matrix th:first-child{z-index:3;background:var(--surface-2)}
.matrix th.now{background:var(--mark);color:var(--mark-ink)}
.matrix .bno{display:inline-block;min-width:26px;font-family:var(--font-display);font-size:16px;color:var(--accent);margin-right:6px;text-align:right}
.matrix .bname{font-weight:500}
.matrix .org{color:var(--fg-muted);font-size:12px;margin-left:6px}
.cell{text-align:center;cursor:pointer;min-width:84px}
.matrix table.many th,.matrix table.many td{padding:6px 6px}
.matrix table.many .cell{min-width:56px}
.matrix table.many .cell .n{font-size:13px}
.matrix table.many th{font-size:11px}
.cell .n{font-weight:700;font-size:14px}
.cell .n .cap{font-weight:400;color:var(--fg-muted);font-size:12px}
.cell .w{display:block;font-size:11px;color:var(--warn);font-weight:600}
.cell .c{display:block;font-size:11px;color:var(--fg-muted)}
.cell.ok{background:var(--ok-soft)} .cell.warn{background:var(--warn-soft)} .cell.full{background:var(--full-soft)} .cell.full .n{color:var(--full)}
.cell.past{opacity:.6}
.cell.promo{outline:2px dashed var(--warn);outline-offset:-3px}
.cell.na{color:var(--fg-muted);cursor:default;background:transparent}
.cell.always{background:var(--neutral-soft);text-align:left;cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar .search{max-width:260px;flex:1 1 180px;padding:8px 10px}
.toolbar select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);max-width:220px}
.count{font-size:13px;color:var(--fg-muted);margin-left:auto}
.list td.name{font-weight:600}
.list tr.cancel td{color:var(--fg-muted);text-decoration:line-through}
.list tr.cancel td.ctrl{text-decoration:none}
.sel{border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface);font-size:13px;font-weight:600}
.sel.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.sel.wait{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.sel.cancel{color:var(--fg-muted)}
.chk{display:inline-flex;align-items:center;gap:6px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.wait{background:var(--warn-soft);color:var(--warn)} .pill.cancel{background:var(--surface-2);color:var(--fg-muted)}
.filter-note{font-size:13px;background:var(--accent-soft);color:var(--accent);padding:6px 10px;border-radius:8px;display:inline-flex;gap:8px;align-items:center}
.filter-note button{background:none;border:0;color:inherit;text-decoration:underline;padding:0}

/* ── TV ── */
.tv{height:calc(100vh - var(--chrome,0px));display:flex;flex-direction:column;padding:1vh 1.4vw;gap:.8vh;overflow:hidden;font-size:clamp(11px,1.55vh,22px)}
.tv-top{display:flex;align-items:flex-end;justify-content:space-between;gap:2vw;border-bottom:2px solid var(--line);padding-bottom:.8vh}
.tv-title{font-family:var(--font-display);font-size:2.6em;line-height:1.05}
.tv-sub{color:var(--fg-muted);font-size:1.05em;margin-top:.3em;display:flex;gap:1.5em;flex-wrap:wrap}
.tv-sub .now{background:var(--mark);color:var(--mark-ink);padding:.1em .7em;border-radius:999px;font-weight:600}
.tv-clock{font-family:var(--font-display);font-size:4.2em;line-height:1;letter-spacing:.02em}
.tv-upd{color:var(--fg-muted);text-align:right;font-size:.95em}
.tv-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr);gap:0 1.6vw}
.tv-col{display:grid;grid-template-rows:auto repeat(var(--rows,26),minmax(0,1fr));min-height:0}
.tv-row{display:grid;grid-template-columns:2.4em minmax(0,1fr) repeat(var(--cols,5),4.2em);gap:.35em;align-items:center;border-bottom:1px solid var(--line);min-height:0;overflow:hidden;padding:.1em 0;line-height:1.2}
.tv-row.head{border-bottom:2px solid var(--line);color:var(--fg-muted);font-size:.85em;letter-spacing:.06em}
.tv-row.head .tc{text-align:center}
.tv-row.head .tc.now{background:var(--mark);color:var(--mark-ink);border-radius:.4em;font-weight:700}
.tv-no{font-family:var(--font-display);font-size:1.35em;color:var(--accent);text-align:right}
.tv-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;min-width:0}
.tv-name small{color:var(--fg-muted);font-weight:400;margin-left:.5em;font-size:.85em}
.tc{text-align:center;border-radius:.4em;font-weight:700;line-height:1.1;padding:0;align-self:stretch;display:flex;align-items:center;justify-content:center;min-height:1.6em}
.tc.ok{background:var(--ok-soft);color:var(--ok)} .tc.warn{background:var(--warn-soft);color:var(--warn)} .tc.full{background:var(--full-soft);color:var(--full)} .tc.past{background:var(--surface-2);color:var(--fg-muted);font-weight:400}
.tc.na{color:var(--line)}
.tc.now{outline:2px solid var(--mark);outline-offset:-2px}
.tv-always{grid-column:3/-1;background:var(--neutral-soft);color:var(--fg-muted);border-radius:.4em;padding:.1em .8em;align-self:stretch;display:flex;align-items:center;justify-content:space-between;font-size:.9em}
.tv-always b{color:var(--fg)}
.tv-legend{display:flex;gap:1.6em;color:var(--fg-muted);font-size:.9em;justify-content:center}
.tv-legend i{display:inline-block;width:.9em;height:.9em;border-radius:.2em;vertical-align:-.1em;margin-right:.35em}
@media (max-width:900px){.tv{height:auto;overflow:visible}.tv-body{grid-template-columns:1fr}.tv-col{grid-template-rows:none}.tv-row{min-height:2.2em}}

/* ── QR 인쇄 ── */
.qr-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:16px}
.qr-tools label{font-size:13px;color:var(--fg-muted);display:inline-flex;gap:6px;align-items:center}
.qr-tools select{border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface)}
.warn-box{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px}
.qr-grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.qr-card{background:#fff;color:#15231F;border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:grid;gap:12px;justify-items:center;text-align:center;break-inside:avoid;page-break-inside:avoid}
.qr-card .ev{font-size:12px;letter-spacing:.08em;color:#5C6C66}
.qr-card .num{font-family:var(--font-display);font-size:64px;line-height:.95;color:#0E7C6B}
.qr-card .num small{display:block;font-family:var(--font-body);font-size:12px;letter-spacing:.2em;color:#5C6C66;margin-bottom:4px}
.qr-card h3{font-size:20px;font-weight:700;line-height:1.3;color:#15231F}
.qr-card .org{font-size:13.5px;color:#5C6C66}
.qr-card .qr{width:min(70%,260px);aspect-ratio:1;max-width:100%}
.qr-card .qr svg{display:block;width:100%;height:100%}
.qr-card .how{font-size:14px;font-weight:600;color:#15231F}
.qr-card .url{font-size:10.5px;color:#5C6C66;word-break:break-all;max-width:100%}
.qr-card .tip{font-size:11px;color:#5C6C66;border-top:1px dashed #D3DDD8;padding-top:6px;margin-top:2px}
/* ── QR 카드 인쇄 (A4 세로, 여백 '기본' 10mm 기준 → 쓸 수 있는 높이 277mm)
   · 한 장에 2개: 132mm 카드 2장 + 4mm (=268mm) · 4개: 2열×2행 132mm (=267mm) · 1개: 카드 1장이 한 쪽
   · 화면 높이(vh)는 인쇄에서 쪽 높이와 다르게 계산되므로 mm 로 고정. 카드 안은 글은 필요한 만큼, QR 은 남는 높이를 채우도록(flex)
     해서 이름이 두 줄이 돼도 잘리지 않고 QR 만 조금 작아짐. 인쇄 전 경고·도구줄·안내문은 찍히지 않음 ── */
@media print{
  @page{size:A4 portrait;margin:10mm}
  body{background:#fff}
  .no-print{display:none !important}
  [data-qr-warn], [data-print-exclude="true"], .qr-tools, .qr-grid ~ .note{display:none !important;visibility:hidden !important;height:0 !important;margin:0 !important;padding:0 !important;overflow:hidden !important}
  .page{max-width:none;padding:0}
  .qr-grid{display:block}
  .qr-card{border:1px solid #ccc;border-radius:0;margin:0 auto;page-break-after:always;break-after:page;width:100%;min-height:0;box-sizing:border-box}
  .qr-grid .qr-card{overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .qr-grid .qr-card>*{flex:0 0 auto}
  .qr-grid .qr-card .qr{flex:1 1 0;min-height:0;height:auto;width:auto;max-width:100%;aspect-ratio:1}
  .qr-grid.per-1 .qr-card{height:272mm;max-height:272mm;padding:12mm 14mm;gap:8px}
  .qr-grid.per-1 .qr-card .qr{max-height:120mm}
  .qr-grid.per-1 .qr-card .qr-logo{height:48px;margin:0} .qr-grid.per-1 .qr-card .ev{font-size:15px} .qr-grid.per-1 .qr-card .num{font-size:88px}
  .qr-grid.per-1 .qr-card h3{font-size:28px} .qr-grid.per-1 .qr-card .org{font-size:16px} .qr-grid.per-1 .qr-card .place-line{font-size:16px;padding:4px 14px}
  .qr-grid.per-1 .qr-card .how{font-size:19px} .qr-grid.per-1 .qr-card .url{font-size:12px} .qr-grid.per-1 .qr-card .tip{font-size:13px}
  .qr-grid.per-2 .qr-card,.qr-grid.per-4 .qr-card{page-break-after:auto;break-after:auto;height:132mm;max-height:132mm}
  .qr-grid.per-2 .qr-card{margin:0 auto 4mm;padding:4mm 8mm}
  .qr-grid.per-2 .qr-card:nth-child(2n){page-break-after:always;break-after:page;margin-bottom:0}
  .qr-grid.per-2 .qr-card .qr{max-height:64mm}
  .qr-grid.per-2 .qr-card .qr-logo{height:26px;margin:0} .qr-grid.per-2 .qr-card .num{font-size:48px} .qr-grid.per-2 .qr-card .ev{font-size:11px}
  .qr-grid.per-2 .qr-card .place-line{padding:2px 10px;font-size:12.5px} .qr-grid.per-2 .qr-card .tip{padding-top:4px;margin-top:0}
  .qr-grid.per-4{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
  .qr-grid.per-4 .qr-card{padding:4mm 5mm}
  .qr-grid.per-4 .qr-card:nth-child(4n){page-break-after:always;break-after:page}
  .qr-grid.per-4 .qr-card .qr{max-height:58mm}
  .qr-grid.per-4 .qr-card .qr-logo{height:24px;margin:0} .qr-grid.per-4 .qr-card .num{font-size:40px} .qr-grid.per-4 .qr-card h3{font-size:16px}
  .qr-grid.per-4 .qr-card .ev{font-size:10.5px} .qr-grid.per-4 .qr-card .org{font-size:12px} .qr-grid.per-4 .qr-card .place-line{padding:2px 8px;font-size:12px}
  .qr-grid.per-4 .qr-card .how{font-size:12.5px} .qr-grid.per-4 .qr-card .url{font-size:9px} .qr-grid.per-4 .qr-card .tip{display:none}
}

/* ── 휴대폰 폭 (#app 너비 ≤ 520px 이면 JS가 .narrow 를 붙임 — 실제 휴대폰과 미리보기 프레임 모두 적용) ── */
.filter-selects{display:none;grid-template-columns:1fr 1fr 1fr;gap:6px}
.filter-selects select{border:1px solid var(--line);border-radius:10px;padding:9px 8px;background:var(--surface);min-width:0;width:100%;font-size:14px}
.cta-bar{max-width:720px;margin:12px auto 0}
.cta-bar:empty{display:none}
.booth-page{max-width:720px}
.app.narrow .page{padding-block:0 24px}
.app.narrow .top{padding-block:10px 8px;flex-wrap:nowrap;gap:10px}
.app.narrow .brand svg{width:28px;height:28px}
.app.narrow .brand img.logo{height:32px}
.app.narrow .brand-name{font-size:18px}
.app.narrow .brand-sub{font-size:12px}
.app.narrow .live{flex-direction:column;align-items:flex-end;gap:0;line-height:1.2}
.app.narrow .live .clock{font-size:20px}
.app.narrow .live .upd{font-size:11px}
.app.narrow .live .dot{display:none}
.app.narrow .summary{font-size:12.5px;gap:4px 14px;padding-block:10px}
.app.narrow .chips{display:none}
.app.narrow .filter-selects{display:grid}
.app.narrow .filters{padding-block:2px 12px}
.app.narrow .search{max-width:none}
.app.narrow .grid{grid-template-columns:1fr;gap:10px}
.app.narrow .legend{font-size:11.5px;gap:4px 10px}
.app.narrow .foot{font-size:12px}
.app.narrow .back{padding:10px 0 2px}
.app.narrow .sign{padding:16px 14px;gap:14px;margin-top:6px}
.app.narrow .sign .no{width:60px;height:60px;font-size:34px}
.app.narrow .sign h2{font-size:19px}
.app.narrow .slot-row{grid-template-columns:88px minmax(0,1fr) auto;gap:8px;padding:8px 10px}
.app.narrow .cta-bar{position:sticky;bottom:0;z-index:5;background:var(--bg);margin:8px -16px 0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 20px -14px rgba(0,0,0,.35)}
.app.narrow .admin-top{padding-block:10px 8px}
.app.narrow .admin-top .brand-name{font-size:17px}
.app.narrow .tools .btn{padding:5px 8px;font-size:12px}
.app.narrow .stats{grid-template-columns:repeat(3,1fr);gap:6px;padding-block:10px}
.app.narrow .stat{padding:8px 10px}
.app.narrow .stat .k{font-size:11px}
.app.narrow .stat .v{font-size:22px}
.app.narrow .stat .v.small{font-size:15px;margin-top:6px}
.app.narrow .tab{padding:8px 10px;font-size:14px}
.app.narrow .toolbar{gap:6px}
.app.narrow .toolbar .search{flex-basis:100%;max-width:none}
.app.narrow .toolbar select{flex:1 1 40%;max-width:none;padding:7px 8px;font-size:13px}
.app.narrow .count{margin-left:0;flex-basis:100%}
.app.narrow .gate{margin-top:6vh;padding:20px 16px}
/* 운영자 명단 카드형 (휴대폰) */
.rlist{display:grid;gap:8px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:4px}
.rcard.cancel{opacity:.6}
.rc-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rc-name{font-weight:700;font-size:16px;display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.rc-line{font-size:13px;color:var(--fg-muted);overflow-wrap:anywhere}
.rc-line b{color:var(--accent);font-family:var(--font-display);font-size:15px;margin-right:2px}
.rc-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.rc-id{font-size:11.5px;color:var(--fg-muted);text-align:right}
.rc-memo{font-size:12px;color:var(--warn)}
.chk.big{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;flex:none;background:var(--surface)}
.chk.big input{width:22px;height:22px}
.chk.big.on{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chk.big input:disabled+span{color:var(--fg-muted)}
/* 출결 버튼 묶음: [출석][결석] — 눌린 쪽에 색, 다시 누르면 미처리로 */
.att{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:var(--surface)}
.att button{border:0;background:none;padding:6px 10px;font-size:13px;font-weight:700;color:var(--fg-muted);min-width:46px;cursor:pointer}
.att button+button{border-left:1px solid var(--line)}
.att button.on.p{background:var(--ok);color:#fff}.att button.on.a{background:var(--full);color:#fff}
.att button:disabled{opacity:.45;cursor:default}
.att.big button{padding:9px 14px;font-size:14px;min-width:60px}
.att-meta{font-size:11.5px;color:var(--fg-muted);white-space:nowrap}
.pill.absent{background:var(--full-soft);color:var(--full)}.pill.open{background:var(--warn-soft);color:var(--warn)}
.bulk-note{font-size:13px;background:var(--full-soft);color:var(--full);padding:6px 10px;border-radius:8px;display:inline-flex;gap:8px;align-items:center;margin:0 0 8px 8px}
.bulk-note button{background:var(--full);color:#fff;border:0;border-radius:6px;padding:3px 10px;font-weight:600}

/* ── 오전반·오후반 공개 ── */
.slot.closed{background:var(--surface-2);color:var(--fg-muted);border:2px dashed var(--line)} .slot.closed .t{color:var(--fg-muted)}
.slot-row.closed .left{color:var(--fg-muted)} .bar.closed i{background:var(--neutral)}
.tc.closed{background:var(--surface-2);color:var(--fg-muted);font-weight:400;font-size:.8em}
.sess{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--fg-muted)}
.sess.open{background:var(--ok-soft);color:var(--ok)} .sess.off{background:var(--full-soft);color:var(--full)}
.sess-panel{display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.sess-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.sess-row .name{font-weight:700;min-width:52px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-weight:600;color:var(--fg-muted);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--fg);color:var(--bg)}
.seg button:disabled{opacity:.5;cursor:default}
.app.narrow .sess-row .name{min-width:0}

/* ── 편의 기능: 제목 홈 링크 · 새로고침 · 큰 글씨 · 연결 끊김 · 맨 위로 · 이전/다음 부스 · 다음 일정 ── */
a.brand{color:inherit;text-decoration:none;border-radius:10px}
a.brand:hover .brand-name{color:var(--accent)}
.live .upd{background:none;border:0;color:var(--fg-muted);font:inherit;padding:2px 4px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.live .upd:hover{background:var(--surface-2)} .live .upd .rf{font-size:14px;color:var(--accent);display:inline-block}
.live .upd.busy .rf{animation:spin 1s linear infinite}
.font-toggle{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:28px;height:28px;font-size:13px;font-weight:700;color:var(--fg-muted);padding:0;line-height:1}
.font-toggle.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.app.big{zoom:1.18}
.offline{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:70;display:flex;align-items:center;gap:10px;background:var(--full);color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;max-width:calc(100vw - 24px);box-shadow:var(--shadow)}
.offline button{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:4px 10px;font-weight:600;white-space:nowrap}
.totop{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:40;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:9px 14px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nav-side{display:inline-flex;gap:6px;align-items:center;padding-top:10px}
.avail-chk{font-size:13.5px;margin-top:2px} .avail-chk small{color:var(--fg-muted);font-weight:400}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;margin-left:2px}
.slot-row .time .soon{display:block;font-weight:600;font-size:11px;color:var(--ok)}
.my-card.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft) inset,var(--shadow)}
.my-place{font-size:13px;color:var(--fg-muted)} .my-place a{font-weight:600}
.app.narrow .nav-side{padding-top:6px}
.app.narrow .nav-side .btn{padding:4px 8px;font-size:12.5px}

/* ── 진행 층 · 층별 배치도 ── */
.tag.floor{background:var(--mark);color:var(--mark-ink);font-weight:600}
.tag.floor.big{font-size:13px;padding:3px 10px}
.chip.link{text-decoration:none;color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.place{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px}
.sign .desc{margin:8px 0 0;font-size:15px;line-height:1.55;color:var(--fg);background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 10px 10px 0;word-break:keep-all}
/* 전체 보기 카드의 한 줄 소개: 설명을 보고 부스를 고를 수 있게. 길면 2줄까지만 보이고 부스 페이지에서 전문 */
.booth-desc{margin:6px 0 2px;font-size:13.5px;line-height:1.5;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;padding-left:9px;border-left:3px solid var(--accent-soft)}
.qr-card .place-line{font-size:14px;font-weight:600;color:#0E7C6B;background:#E6F3EF;border-radius:8px;padding:4px 12px}
.map-page{max-width:900px}
.map-tabs{margin-top:8px}
.map-wrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:78vh;box-shadow:var(--shadow);touch-action:pan-x pan-y pinch-zoom;-webkit-overflow-scrolling:touch}
.map-canvas{position:relative;width:100%;background:#fff}
.fp{position:absolute;inset:0}
.fp svg{display:block;width:100%;height:100%;user-select:none}
.fp .out{fill:#EAF2E6}.fp .edge{stroke:#A9C29F;stroke-width:1;stroke-dasharray:4 3}
.fp .bld{fill:#F3F5F4;stroke:#5E6C67;stroke-width:1.8;stroke-linejoin:round}
.fp .hall{fill:#FFFFFF;stroke:#C3CCC8;stroke-width:.7}
.fp .room{fill:#E2E8E5;stroke:#97A49F;stroke-width:.7}
.fp .void{fill:#F0F2F1;stroke:#BAC4C0;stroke-width:.7;stroke-dasharray:3 2}
.fp .furn{fill:#EBEEEC;stroke:#C3CCC8;stroke-width:.6}
.fp .water{fill:#D5E7F4;stroke:#98C0DE;stroke-width:.7}
.fp .door{fill:#FFFFFF}.fp .icon{stroke:#8A9792;stroke-width:.6;fill:none}
.fp .arrow{fill:#0E7C6B}.fp .arrow-line{stroke:#0E7C6B;stroke-width:1.4}
.fp .slot{fill:#FFFFFF;stroke:#0E7C6B;stroke-width:1.3}
.fp .code{font-family:var(--font-body);font-weight:700;fill:#0E7C6B}
.fp .lab{font-family:var(--font-body);font-size:6px;font-weight:500;fill:#5C6C66}
.fp .lab.big{font-size:8px;font-weight:700;fill:#3F4F49;letter-spacing:.3px}.fp .lab.tiny{font-size:4.6px}.fp .lab.water-lab{fill:#3E6E90}
.fp .lab.no{font-weight:600;fill:#6B7A74;letter-spacing:.2px}
.map-tabs{display:flex;align-items:center}
.zoom{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-muted);padding-bottom:4px}
.zoom .btn{padding:4px 10px;font-size:15px;line-height:1}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);display:grid;place-items:center;padding:0;font:700 13px/1 var(--font-body);color:#fff;cursor:pointer;background:var(--neutral)}
.pin.ok{background:var(--ok)} .pin.warn{background:var(--warn)} .pin.full{background:var(--full)} .pin.past{background:var(--neutral)} .pin.closed{background:#7A8A84} .pin.always{background:#4C7BD9}
.pin.hl{outline:3px solid var(--mark);outline-offset:2px;z-index:2;animation:pinpulse 1.6s ease-in-out infinite}
@keyframes pinpulse{0%,100%{transform:translate(-50%,-50%) scale(1.15)}50%{transform:translate(-50%,-50%) scale(1.3)}}
.map-canvas .pin:hover{z-index:3;transform:translate(-50%,-50%) scale(1.15)}
.map-list{display:grid;gap:6px;margin-top:14px}
.map-list h3{font-size:15px;font-weight:700;margin-top:10px}
.map-list h3 small{font-weight:400;color:var(--fg-muted);font-size:12.5px;margin-left:6px}
.map-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;color:inherit;cursor:pointer}
.map-row .pin{position:static;transform:none;width:30px;height:30px;box-shadow:none;animation:none;outline:0}
.map-row.hl{border-color:var(--mark);box-shadow:0 0 0 2px var(--mark) inset}
.mr-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.mr-name small{display:block;font-weight:400;font-size:12px;color:var(--fg-muted)}
.mr-st{font-size:12.5px;white-space:nowrap;color:var(--fg-muted)} .mr-st.ok{color:var(--ok)} .mr-st.warn{color:var(--warn)} .mr-st.full{color:var(--full)}
.app.narrow .map-row .pin{width:26px;height:26px;font-size:11.5px}

function saveMe(me, remember) { S.me = Object.assign({}, S.me, me); try { if (remember === false) localStorage.removeItem('me'); else localStorage.setItem('me', JSON.stringify(S.me)); } catch (x) { } }
function shortTime(slot) { const t = parseSlot(slot); return t ? slot.split(/[~\-–—]/)[0].trim() : slot; }
function boothSummary(b, now) {
  if (b.mode === ALWAYS) return null;
  let left = 0, open = 0, total = 0, closed = 0;
  (b.slots || []).forEach(s => { const i = slotInfo(b, s, now); if (i.phase === 'past') return; if (i.closed) { closed++; return; } total++; left += i.left; if (!i.full) open++; });

/** 서버 함수 호출: rpc('함수이름', 인자…) → Promise. 방법 A 는 google.script.run, 방법 B 는 fetch(POST) — 호출하는 쪽은 구분하지 않음 */
function rpc(fn) {
  const args = Array.prototype.slice.call(arguments, 1);
  if (STATIC) return apiFetch(fn, args);
  return new Promise((resolve, reject) => {
    if (!window.google || !google.script || !google.script.run) { reject(new Error('서버에 연결할 수 없습니다. 페이지를 새로고침해 주세요.')); return; }
    const runner = google.script.run.withSuccessHandler(resolve).withFailureHandler(e => reject(e instanceof Error ? e : new Error(e && e.message ? e.message : String(e))));
    runner[fn].apply(runner, args);
  });
}
/**
 * 방법 B: Apps Script 웹 앱에 {"fn":…,"args":[…]} 를 POST — Code.gs doPost 가 {"ok":true,"data":…} 또는 {"ok":false,"error":…} 로 답함.
 *  · credentials:'omit' — 쿠키를 보내지 않아 Google 이 로그인 계정을 고르지 않음 (계정이 여러 개여도 /u/4/ 가 생기지 않는 핵심)
 *  · Content-Type text/plain — 브라우저가 사전 확인(preflight) 요청을 보내지 않음 (Apps Script 는 OPTIONS 에 답하지 않음)
 *  · Apps Script 는 302 로 script.googleusercontent.com 에 결과를 두고, 그 응답에 Access-Control-Allow-Origin: * 이 붙어 다른 도메인에서도 읽힘
 */
async function apiFetch(fn, args) {
  if (API_PROBLEM) throw new Error(API_PROBLEM);
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), fn === 'reserveGroup' ? 150000 : 45000) : null; // 예약 접수는 서버 잠금 대기(최대 15초)가 있어 넉넉히, 단체 접수(최대 15명)는 더 길게
  let r;
  try {
    r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      credentials: 'omit', redirect: 'follow', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined });
  } catch (e) {
    throw new Error(e && e.name === 'AbortError' ? '서버 응답이 없습니다 (시간 초과). 잠시 후 다시 시도해 주세요.' : '서버에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.');
  } finally { if (timer) clearTimeout(timer); }
  const text = await r.text();
  let j = null;
  try { j = JSON.parse(text); } catch (x) { /* JSON 이 아님 — 로그인 화면(HTML) 등 */ }
  if (!j || typeof j !== 'object') {
    throw new Error(r.ok ? '서버가 데이터 대신 다른 화면을 보냈습니다. Apps Script [배포 관리]에서 액세스 권한이 "모든 사용자"인지, index.html 의 BOOTH_API_URL 이 현재 배포의 …/exec 주소인지 확인하세요.'
      : '서버 응답 오류 (' + r.status + '). 잠시 후 다시 시도해 주세요.');
  }
  if (j.ok !== true) throw new Error(j.error || '서버 오류');
  return j.data;
}

let toastTimer = null;
function toast(msg, kind) {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.className = 'toast' + (kind === 'err' ? ' err' : '');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 3200);
}
function setOnline(ok) {
  S.online = ok;
  $$('[data-dot]').forEach(d => d.classList.toggle('off', !ok));
  let bar = $('#offline-bar');
  if (ok) { if (bar) bar.remove(); return; }

  bar.innerHTML = `<span class="spin" aria-hidden="true"></span><span>서버와 연결이 끊겼습니다 — 자동으로 다시 연결 중입니다. 화면의 숫자는 <b>${esc(S.status.updatedAt || '--:--')}</b> 기준입니다.</span><button type="button" data-action="refresh-now">다시 시도</button>`;
}
window.addEventListener('offline', () => setOnline(false));
window.addEventListener('online', () => { refresh(); });

// ───────── 데이터 갱신 ─────────
let lastRefreshAt = 0, failures = 0, lastInteraction = Date.now(), refreshing = false;
async function refresh() {
  if (document.hidden || refreshing) return;
  refreshing = true;
  try {
    if (S.view === 'admin') {
      if (!S.admin.pin) return;
      const d = await rpc('getOperatorData', S.admin.pin);
      S.admin.data = d; S.status = d; onStatus(d);
      renderAdminParts();
    } else {
      S.status = await rpc('getPublicStatus'); onStatus(S.status);
      updateView();
    }
    failures = 0;
    setOnline(true);
  } catch (e) {
    failures++;
    setOnline(false);
    if (S.view === 'admin' && /PIN/.test(e.message || '')) { S.admin.pin = ''; try { sessionStorage.removeItem('pin'); } catch (x) { } render(); }
  } finally {
    lastRefreshAt = Date.now();
    refreshing = false;
  }
}
function isVisitorView() { return S.view === 'home' || S.view === 'booth' || S.view === 'map'; }
function nextDelay() {
  const base = POLL[S.view];
  const backoff = Math.min(Math.pow(2, failures), 8); // 실패 시 2,4,8배 (최대 3분)
  return Math.min(base * backoff, 180000) * (0.85 + Math.random() * 0.3);
}
function schedule() {
  clearTimeout(S.timer);
  if (POLL[S.view]) S.timer = setTimeout(tick, nextDelay());
  clearInterval(S.clock);
  S.clock = setInterval(tickClock, 1000);
  tickClock();
}
async function tick() {
  if (isVisitorView() && Date.now() - lastInteraction > IDLE_PAUSE_MS) {
    // 잊힌 탭은 서버를 두드리지 않음. 화면을 만지면 noteInteraction()이 바로 갱신하고 다시 돌림
    const u = $('[data-updated]'); if (u) u.textContent = (S.status.updatedAt || '') + ' · 자동 갱신 멈춤, 화면을 탭하면 재개';
    S.timer = null;
    return;
  }
  await refresh();
  S.timer = setTimeout(tick, nextDelay());
}
function noteInteraction() {
  const idle = Date.now() - lastInteraction > IDLE_PAUSE_MS;
  lastInteraction = Date.now();
  if (idle && isVisitorView() && !S.timer) { refresh(); S.timer = setTimeout(tick, nextDelay()); }
}
function tickClock() {
  const now = kstNow();
  $$('[data-clock]').forEach(el => { el.textContent = el.dataset.clock === 'hms' ? now.hms : now.hm; });
}

const MAX_CHIPS = 8; // 카드에 보이는 시간대 수. 시간대가 많은 행사(예: 20분 간격 21개)는 지난 것을 숨기고 앞의 8개만, 나머지는 '+n'
function slotChipsHTML(b, now) {
  let list = (b.slots || []).map(s => ({ s, i: slotInfo(b, s, now) }));
  let hiddenPast = 0, more = 0;
  if (list.length > MAX_CHIPS) {
    const upcoming = list.filter(x => x.i.phase !== 'past');
    hiddenPast = list.length - upcoming.length;
    list = upcoming;
    if (list.length > MAX_CHIPS) { more = list.length - MAX_CHIPS; list = list.slice(0, MAX_CHIPS); }
  }
  return `<div class="slots">${list.map(({ s, i }) => {
    const label = i.phase === 'past' ? '종료' : i.closed ? '공개 전' : i.waitFull ? '마감' : i.full ? '대기' : i.left + '석';
    return `<div class="slot ${i.cls}${i.phase === 'now' ? ' now' : ''}" title="${attr(s)} · 확정 ${i.ok}/${i.cap}${i.wait || i.full ? ' · 대기 ' + i.wait + '/' + i.waitMax + (i.waitFull ? ' (접수 마감)' : ' (대기 신청 가능)') : ''}${i.closed ? ' · ' + attr(closedNote([s])) : ''}"><span class="t">${esc(shortTime(s))}</span><span class="n">${label}</span></div>`;

}

/** 운영자: 지금 보이는 명단을 CSV(엑셀에서 열림)로 내려받기 */
function downloadCsv() {
  const list = S.admin.lastList || [];
  if (!list.length) { toast('내려받을 명단이 없습니다', 'err'); return; }
  if (PREVIEW) { toast('미리보기에서는 파일 저장이 막혀 있습니다. 실제 배포에서는 ' + list.length + '건이 CSV로 저장됩니다'); return; }
  const cols = [['예약번호', r => r.no], ['날짜', r => r.date || ''], ['접수', r => r.time], ['부스번호', r => r.booth], ['부스명', r => r.boothName], ['위치', r => placeText(booth(r.booth) || {})], ['시간대', r => r.slot], ['이름', r => r.name], ['연락처', r => r.phone], ['소속', r => r.org], ['학년', r => r.grade], ['상태', r => r.status], ['출결', r => r.att || (r.checkin ? '출석' : '')], ['출결시각', r => r.attTime || ''], ['출결처리', r => r.attBy || ''], ['메모', r => r.memo || ''], ['알림', r => r.notice || '']];
  const cell = v => { const t = String(v == null ? '' : v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const csv = '\uFEFF' + cols.map(c => c[0]).join(',') + '\n' + list.map(r => cols.map(c => cell(c[1](r))).join(',')).join('\n');
  const f = S.admin.f; const name = '예약명단' + (f.booth ? '_부스' + f.booth : '') + (f.slot ? '_' + f.slot.replace(/[^0-9]/g, '').slice(0, 4) : '') + '_' + kstNow().hms.replace(/:/g, '') + '.csv';
  try {
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast(list.length + '건을 ' + name + ' 로 내려받습니다');
  } catch (e) { toast('내려받기에 실패했습니다: ' + (e.message || e), 'err'); }
}

function updateTV() {
  const now = kstNow();
  const booths = (S.status.booths || []).slice().sort((a, b) => a.no - b.no);
  const allTv = allSlots(booths.filter(b => b.mode === CLASS));
  const TV_MAX = 7; // TV 한 화면에 보여줄 시간대 수. 더 많으면 '지금'부터 7개(행사일 전에는 처음 7개)
  let slots = allTv;
  if (allTv.length > TV_MAX) {
    let idx = allTv.findIndex(s => phaseOf(s, now) !== 'past');
    if (idx < 0) idx = allTv.length - TV_MAX;
    idx = Math.max(0, Math.min(idx, allTv.length - TV_MAX));
    slots = allTv.slice(idx, idx + TV_MAX);
  }
  const cur = currentSlot(S.status.defaultSlots, now);
  $('[data-tv-title]').textContent = (S.status.event || {}).name || '';
  $('[data-tv-sub]').innerHTML = `<span>부스 예약 현황 · 숫자는 잔여 좌석</span>${sessionPillsHTML()}${cur.now ? `<span class="now">지금 ${esc(cur.now)} 진행 중</span>` : cur.next ? `<span>다음 시간대 ${esc(cur.next)}</span>` : ''}${allTv.length > slots.length ? `<span>표시 ${esc(shortTime(slots[0]))}~${esc(slots[slots.length - 1].split(/[~\-–—]/).pop().trim())} (전체 ${allTv.length}개 중 ${slots.length}개, 시간이 지나면 자동으로 넘어감)</span>` : ''}`;
  const half = Math.ceil(booths.length / 2);
  const cols = [booths.slice(0, half), booths.slice(half)];
  const rowsPerCol = Math.max(half, 1);
  $('[data-tv-body]').innerHTML = cols.map(col => `<div class="tv-col" style="--rows:${rowsPerCol};--cols:${slots.length}">
    <div class="tv-row head"><span></span><span>부스</span>${slots.map(s => `<span class="tc${phaseOf(s, now) === 'now' ? ' now' : ''}">${esc(shortTime(s))}</span>`).join('')}</div>
    ${col.map(b => `<div class="tv-row"><span class="tv-no">${b.no}</span><span class="tv-name">${esc(b.name)}<small>${esc(b.org)}${b.pos ? ' · ' + esc(b.pos) : b.floor ? ' · ' + esc(b.floor) : ''}</small></span>${b.mode === ALWAYS ? `<span class="tv-always"><span>상시운영 · 방문 등록 후 참여</span><b>${(b.counts && b.counts[ALWAYS] && b.counts[ALWAYS].ok) || 0}명</b></span>` : slots.map(s => {
      if ((b.slots || []).indexOf(s) === -1) return `<span class="tc na">·</span>`;
      const i = slotInfo(b, s, now);
      return `<span class="tc ${i.cls}${i.phase === 'now' ? ' now' : ''}">${i.phase === 'past' ? '종료' : i.closed ? '공개전' : i.waitFull ? '마감' : i.full ? '대기' : i.left}</span>`;
    }).join('')}</div>`).join('')}
  </div>`).join('');
  const u = $('[data-updated]'); if (u) u.textContent = S.status.updatedAt || '';
}

      if (!/viewBox/.test(a)) a += ` viewBox="0 0 ${n} ${n}"`;

    });
    return svg;
  } catch (e) { return `<div class="note">QR을 만들 수 없습니다. 네트워크를 확인한 뒤 새로고침해 주세요.</div>`; }

  app.dataset.view = 'splash';
  app.innerHTML = `<div class="splash">${ANCHOR_SVG}<div class="splash-title">${esc(title)}</div>` +
    (detail ? `<div class="splash-detail">${esc(detail)}</div><button type="button" class="btn primary" data-action="boot-retry">다시 시도</button>` : `<div class="splash-detail"><span class="spin" aria-hidden="true"></span> 잠시만 기다려 주세요</div>`) + `</div>`;
}
async function bootstrap() {
  renderSplash('불러오는 중…');
  let err = null;
  for (let i = 0; i < 4; i++) {
    try { S.status = await rpc('getPublicStatus'); onStatus(S.status); return true; }
    catch (e) { err = e; if (API_PROBLEM) break; await new Promise(res => setTimeout(res, 1200 * (i + 1))); }
  }
  renderSplash('서버에 연결하지 못했습니다', (err && err.message) || '');
  return false;
}

(async function start() {
  if (GAS && !BOOT_INJECTED) { // 방법 A 인데 서버가 시작 데이터를 못 채운 경우(예전 doGet): 주소의 ?page= 는 google.script.url 로
    try { BOOT.params = await new Promise(res => google.script.url.getLocation(loc => res((loc && loc.parameter) || {}))); } catch (x) { }
  }
  if (!BOOT.status && !(await bootstrap())) return; // 방법 B: 첫 현황 받기 (실패하면 [다시 시도] 화면에서 멈춤)
  onStatus(S.status);
  if (STATIC && S.status.event && S.status.event.name) document.title = S.status.event.name + ' · 부스 예약';
  const p = BOOT.params || {};
  if (p.date) { S.day = String(p.date); applyDay(); }
  if (p.page === 'admin') {
    S.view = 'admin';
    // ?page=admin&booth=12 → 부스 담당자용: 그 부스 명단(체크인)만 바로 표시
    if (p.booth) { S.admin.f.booth = String(Number(p.booth)); S.admin.tab = 'list'; }
  }
  else if (p.page === 'tv') S.view = 'tv';
  else if (p.page === 'qr') S.view = 'qr';
  else if (p.page === 'my') S.view = 'my';
  else if (p.page === 'map') { S.view = 'map'; if (p.booth) S.map.hl = Number(p.booth); if (p.floor) S.map.key = mapOfFloor(String(p.floor)); }
  else if (p.booth) { S.view = 'booth'; S.boothNo = Number(p.booth); }
  try { const saved = sessionStorage.getItem('pin'); if (saved) S.admin.pin = saved; } catch (x) { }
  if (PREVIEW) {
    S.phone = window.innerWidth >= 760; // 넓은 화면에서는 휴대폰 프레임으로 시작 (실제 휴대폰에서는 그대로)
    try { const v = localStorage.getItem('phonePreview'); if (v === '0') S.phone = false; if (v === '1') S.phone = true; } catch (x) { }
  }
  loadFilters();
  syncNarrow();
  if (window.ResizeObserver) new ResizeObserver(syncNarrow).observe($('#app'));
  else window.addEventListener('resize', syncNarrow);
  // 맨 위로 버튼: 길게 스크롤했을 때만 보임
  const top = document.createElement('button'); top.type = 'button'; top.id = 'totop'; top.className = 'totop no-print'; top.hidden = true; top.textContent = '↑ 맨 위'; top.dataset.action = 'totop'; document.body.appendChild(top);
  let topTimer = null;
  const onScroll = () => { if (topTimer) return; topTimer = setTimeout(() => { topTimer = null; const y = window.scrollY || ($('#app') && $('#app').scrollTop) || 0; top.hidden = y < 700 || S.view === 'tv'; }, 150); };
  window.addEventListener('scroll', onScroll, { passive: true }); $('#app').addEventListener('scroll', onScroll, { passive: true });
  render();
  pushNav(true); // 첫 화면을 기록에 등록 → 안에서 이동한 뒤 뒤로가기가 여기로 돌아옴
  try {
    if (window.google && google.script && google.script.history) google.script.history.setChangeHandler(e => applyNavState(e && e.state, e && e.location && e.location.parameter));
    else window.addEventListener('popstate', e => applyNavState(e.state, Object.fromEntries(new URLSearchParams(location.search))));
  } catch (x) { }
  if (S.view === 'admin' && S.admin.pin) loginAdmin(S.admin.pin);
  watchStart();
  window.__boothDebug = () => ({ poll: Object.assign({}, POLL), view: S.view, mode: STATIC ? 'B' : 'A' }); // 점검용 (브라우저 콘솔에서 __boothDebug())
})();
})();
</script>
